<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurant Carol</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css?v=3.0" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="RestaurantCarol.Client.styles.css?v=3.0" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <div style="min-height: 100vh; background-color: #2b2728; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #D2AF6D;">
            <img src="images/carol_logo.png" alt="Logo" style="width: 100px; height: 100px; margin-bottom: 20px;" />
            <h2>Loading Restaurant Carol...</h2>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        window.blazorAuth = {
            get: function (key) {
                try { return localStorage.getItem(key); } catch (e) { return null; }
            },
            set: function (key, value) {
                try { localStorage.setItem(key, value); } catch (e) {}
            },
            remove: function (key) {
                try { localStorage.removeItem(key); } catch (e) {}
            }
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
